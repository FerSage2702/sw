<!DOCTYPE html>
<html lang="ru">
<head>

<style>
:root{--cyan:#64eaff;--gold:#ffcf6a;--red:#ff6177;--panel:#0b1729ed;--stroke:#2b526d;--text:#e5f4ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050c;color:var(--text);font-family:Arial,Helvetica,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:absolute;top:0;left:0;right:0;padding:16px 22px;display:none;pointer-events:none;text-shadow:0 2px 5px #000;gap:18px;align-items:flex-start}.hud-col{min-width:180px}.tiny{font-size:10px;letter-spacing:2px;color:#83a8be;font-weight:bold}.big{font-size:19px;font-weight:bold;letter-spacing:1px}.bar{height:7px;background:#14283a;border:1px solid #31516a;margin:5px 0 11px;border-radius:9px;overflow:hidden}.fill{height:100%;width:100%;background:var(--cyan);transition:width .15s}.hud-mid{flex:1;text-align:center}.hud-right{text-align:right;min-width:130px}#bossBox{display:none;width:min(350px,75vw);margin:7px auto}.bossbar{background:#782235}#toast{position:absolute;top:23%;width:100%;text-align:center;pointer-events:none;font-weight:900;font-size:clamp(22px,4vw,50px);letter-spacing:5px;color:#fff;text-shadow:0 0 25px #45d9ff;opacity:0;transition:opacity .2s}#tip{position:absolute;bottom:14px;left:0;right:0;text-align:center;pointer-events:none;font-size:11px;letter-spacing:1px;color:#8ba3b7}#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(130deg,#030713e8,#061829a8,#030713eb);overflow:auto}.panel{width:min(690px,100%);max-height:96vh;overflow:auto;text-align:center;border:1px solid #34617e;border-radius:14px;background:linear-gradient(145deg,#101e32f5,#060c19f5);box-shadow:0 0 90px #0099ff25,0 24px 80px #000;padding:26px 27px}.eyebrow{font-weight:bold;letter-spacing:6px;font-size:11px;color:var(--gold)}h1{font-size:clamp(33px,6vw,62px);letter-spacing:5px;color:var(--gold);line-height:1;margin:18px 0 4px;text-shadow:0 0 22px #ffba4b50}h2{margin:8px 0 15px;font-size:20px;letter-spacing:4px;color:#e8f3ff}p{color:#a8bdcc;line-height:1.6;font-size:14px;margin:10px auto 17px;max-width:570px}button{appearance:none;background:linear-gradient(135deg,#10314a,#092033);border:1px solid #4587a9;border-radius:5px;padding:12px 16px;color:#ddf6ff;cursor:pointer;text-transform:uppercase;font-weight:bold;letter-spacing:2px;font-size:12px;transition:.15s}button:hover,button:focus-visible{background:#194563;box-shadow:0 0 15px #27baff49;outline:none}button:disabled{filter:grayscale(1);opacity:.5;cursor:not-allowed}.primary{background:linear-gradient(130deg,#ffc35f,#d68c2a);color:#13100b;border-color:#fdda91}.primary:hover{background:#ffe098;box-shadow:0 0 22px #ffaa3877}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.stat{padding:11px 5px;border:1px solid #244258;background:#071321;border-radius:5px}.stat strong{font-size:22px;display:block;color:#f7d17b}.stat small{font-size:10px;letter-spacing:1px;color:#819cac}.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.shop button{padding:12px 7px;text-transform:none;letter-spacing:0;min-height:125px}.shop b{display:block;font-size:14px;margin:6px 0}.shop span{display:block;font-size:11px;color:#9ab2c4;line-height:1.4}.price{color:#ffcf6a!important;margin-top:6px}.credits{color:var(--gold);font-weight:bold}.line{height:1px;background:#24445c;margin:18px 0}.controls{color:#8facbf;font-size:12px;line-height:2}.tag{display:inline-block;border:1px solid #3d6980;padding:5px 9px;color:#9fdfff;font-size:10px;letter-spacing:1px;border-radius:30px;margin:3px}.muted{color:#7290a4}#mobile{display:none;position:absolute;inset:0;pointer-events:none}#stick{position:absolute;left:24px;bottom:38px;width:118px;height:118px;border:2px solid #5ba9cb75;border-radius:50%;background:#2e5d7d25;pointer-events:auto;touch-action:none}#knob{position:absolute;width:48px;height:48px;left:33px;top:33px;border-radius:50%;background:#77d8f177;border:1px solid #b5f3ff}#fire{position:absolute;right:25px;bottom:44px;width:95px;height:95px;border-radius:50%;pointer-events:auto;background:#84293570;border:2px solid #ff7f90;font-size:14px}#pause{position:absolute;right:17px;top:17px;display:none;pointer-events:auto;padding:8px 12px;font-size:17px;z-index:2}#footerNote{font-size:10px;color:#69859a;margin-top:15px}@media(max-width:650px){#hud{padding:12px;gap:7px}.hud-col{min-width:105px}.big{font-size:13px}.hud-right{min-width:80px}.tiny{font-size:8px;letter-spacing:1px}.panel{padding:18px 14px}.shop{grid-template-columns:1fr}.shop button{min-height:80px}.stats{gap:3px}.stat strong{font-size:17px}#tip{display:none}}@media(pointer:coarse){#mobile.playing{display:block}}
</style></head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="hud-col"><div class="tiny">КОРПУС</div><div class="bar"><div class="fill" id="healthBar"></div></div><div class="tiny">ЩИТ</div><div class="bar"><div class="fill" id="shieldBar" style="background:#8c8cff"></div></div><div class="tiny">ЭНЕРГИЯ / РЫВОК</div><div class="bar"><div class="fill" id="dashBar" style="background:#ffcf6a"></div></div></div><div class="hud-mid"><div class="tiny" id="missionText">СЕКТОР 01</div><div class="big" id="waveText">ВОЛНА 1</div><div id="bossBox"><div class="tiny" id="bossName">ИМПЕРСКИЙ РАЗРУШИТЕЛЬ</div><div class="bar"><div class="fill bossbar" id="bossBar"></div></div></div></div><div class="hud-right"><div class="tiny">СЧЁТ</div><div class="big" id="scoreText">0</div><div class="tiny" style="margin-top:12px">КРЕДИТЫ</div><div class="big" id="creditText">0</div></div></div>
<div id="toast"></div><div id="tip">WASD / СТРЕЛКИ — ДВИЖЕНИЕ • ПРОБЕЛ / МЫШЬ — ОГОНЬ • SHIFT — РЫВОК • P / ESC — ПАУЗА</div><button id="pause" aria-label="Пауза">Ⅱ</button>
<div id="mobile"><div id="stick"><div id="knob"></div></div><button id="fire">ОГОНЬ</button></div>
<div id="menu"><div class="panel" id="panel"></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d',{alpha:false}),hud=$('hud'),menu=$('menu'),panel=$('panel');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let W=innerWidth,H=innerHeight,DPR=1,t=0,last=0,mode='menu',player=null,bullets=[],enemies=[],particles=[],pickups=[],stars=[],texts=[],wave=0,waveClock=0,spawnLeft=0,spawnClock=0,boss=null,score=0,credits=0,kills=0,runUpgrade={damage:0,fire:0,shield:0},toastClock=0,shake=0,settings={mute:false},joy={x:0,y:0},firing=false;
const keys={},pointer={x:0,y:0,down:false},SAVE='outerRimSquadronSaveV2';
let save={best:0,totalKills:0,bank:0,level:{damage:0,armor:0,engine:0},wins:0};
try{const val=JSON.parse(localStorage.getItem(SAVE));if(val){save={...save,...val,level:{...save.level,...val.level}}}}catch(e){}
function persist(){try{localStorage.setItem(SAVE,JSON.stringify(save))}catch(e){}}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);stars=Array.from({length:Math.min(180,Math.floor(W*H/5400))},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(.5,1.9),speed:rnd(15,95),alpha:rnd(.2,.9)}));}addEventListener('resize',resize);resize();
let audioCtx;function tone(freq=400,dur=.08,type='sawtooth',vol=.025,endFreq){if(settings.mute)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;o.type=type;o.frequency.setValueAtTime(freq,now);if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),now+dur);g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.001,now+dur);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+dur)}catch(e){}}
const btn=(name,action,primary=false,disabled=false)=>`<button ${primary?'class="primary"':''} ${disabled?'disabled':''} data-action="${action}">${name}</button>`;
function show(html){panel.innerHTML=html;menu.style.display='flex';hud.style.display='none';$('pause').style.display='none';$('mobile').classList.remove('playing');}
function splash(){mode='menu';show(`<div class="eyebrow">A LONG TIME AGO IN A GALAXY FAR, FAR AWAY...</div><h1>STAR WARS</h1><h2>OUTER RIM · SQUADRON</h2><p>На дальних рубежах галактики пилот повстанческой эскадрильи принимает последний вызов. Перехватывай TIE-истребители, защищай сектор, уничтожай имперские корабли и улучшай свой звездолёт.</p><div class="stats"><div class="stat"><strong>${save.best.toLocaleString('ru')}</strong><small>РЕКОРД</small></div><div class="stat"><strong>${save.totalKills}</strong><small>СБИТО ЦЕЛЕЙ</small></div><div class="stat"><strong>${save.bank}</strong><small>КРЕДИТЫ БАЗЫ</small></div></div><div class="actions">${btn('▶ НАЧАТЬ МИССИЮ','start',true)}${btn('⚙ АНГАР','hangar')}${btn(settings.mute?'🔇 ЗВУК ВЫКЛ':'♫ ЗВУК ВКЛ','sound')}</div><div class="line"></div><div class="controls">ПК: WASD / стрелки — полёт • пробел или кнопка мыши — стрельба • Shift — рывок • P / Esc — пауза<br>Телефон: левый джойстик — полёт • правая кнопка — стрельба • двойное касание — рывок</div><div id="footerNote">Фанатская некоммерческая браузерная игра. Не связана с Lucasfilm или Disney. Все изображения рисуются кодом.</div>`)}
function hangar(){mode='hangar';const items=[['damage','ЛАЗЕРНЫЕ ПУШКИ','+15% урона за уровень'],['armor','БРОНЯ КОРПУСА','+20 максимального здоровья'],['engine','ГЕНЕРАТОР ЩИТА','+15 щита и ускорение зарядки']];show(`<div class="eyebrow">БАЗА ПОВСТАНЦЕВ</div><h2>АНГАР УЛУЧШЕНИЙ</h2><p>Улучшения остаются после гибели. Зарабатывай кредиты в бою, возвращайся в ангар и развивай корабль.</p><div class="big credits">◈ ${save.bank} КРЕДИТОВ</div><div class="shop">${items.map(([id,title,desc])=>{let level=save.level[id],price=100+level*95;return `<button data-action="buy:${id}" ${level>=5||save.bank<price?'disabled':''}><div class="tiny">УРОВЕНЬ ${level}/5</div><b>${title}</b><span>${desc}</span><span class="price">${level>=5?'МАКСИМУМ':price+' ◈'}</span></button>`}).join('')}</div><div class="actions">${btn('▶ В БОЙ','start',true)}${btn('← НАЗАД','home')}</div>`)}
function start(){mode='playing';menu.style.display='none';hud.style.display='flex';$('pause').style.display='block';$('mobile').classList.add('playing');wave=0;score=0;credits=0;kills=0;bullets=[];enemies=[];particles=[];pickups=[];texts=[];boss=null;runUpgrade={damage:0,fire:0,shield:0};player={x:W/2,y:H*.77,r:16,hp:100+save.level.armor*20,maxHp:100+save.level.armor*20,shield:55+save.level.engine*15,maxShield:55+save.level.engine*15,speed:290,fire:0,inv:1.5,dash:1,dashing:0,angle:0};nextWave();updateHUD()}
function nextWave(){wave++;waveClock=0;spawnClock=1.2;spawnLeft=wave===5?0:5+wave*3;boss=null;popToast(wave===5?'ПРЕДУПРЕЖДЕНИЕ: ФЛАГМАН':'СЕКТОР '+String(wave).padStart(2,'0'));tone(230,.4,'sine',.05,420);if(wave===5)spawnBoss()}
function spawnBoss(){boss={x:W/2,y:-160,w:130,h:125,hp:1700,maxHp:1700,fire:2.3,movement:0,entered:false};$('bossBox').style.display='block';popToast('ИМПЕРСКИЙ РАЗРУШИТЕЛЬ')}
function enemy(type){let data={tie:{hp:36,speed:90,r:16,fire:2.7,points:100,color:'#a9c9dc'},interceptor:{hp:27,speed:160,r:13,fire:1.75,points:160,color:'#ff7182'},bomber:{hp:95,speed:65,r:22,fire:3.3,points:250,color:'#c6a5ff'}}[type];let x=rnd(35,Math.max(36,W-35));enemies.push({...data,type,x,y:-35,hp:data.hp,maxHp:data.hp,phase:rnd(0,6),f:rnd(.4,2),vx:0});}
function shot(x,y,vx,vy,enemy=false,damage=16,color){bullets.push({x,y,vx,vy,r:enemy?5:3.8,enemy,damage,color:color||(enemy?'#ff536b':'#71f4ff'),life:5})}
function burst(x,y,count,color='#ffb463',power=170){for(let i=0;i<count;i++){let a=rnd(0,Math.PI*2),speed=rnd(25,power),life=rnd(.2,.85);particles.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life,max:life,r:rnd(1,4),color})}if(particles.length>550)particles.splice(0,particles.length-550)}
function floatText(x,y,value,color='#ffd27a'){texts.push({x,y,value,color,life:1})}
function popToast(s){$('toast').textContent=s;$('toast').style.opacity='1';toastClock=1.8}
function hurt(d){if(player.inv>0||mode!=='playing')return;let take=Math.min(player.shield,d);player.shield-=take;player.hp-=d-take;player.inv=.43;shake=Math.min(14,shake+5);burst(player.x,player.y,9,take>=d?'#8cbbff':'#ff8b6d');tone(120,.2,'sawtooth',.045,45);if(player.hp<=0){player.hp=0;finish(false)}}
function damageEnemy(e,d,isBoss=false){e.hp-=d;burst(e.x,e.y,2,isBoss?'#ffaa66':'#b4eaff',65);if(e.hp<=0){if(isBoss){burst(e.x,e.y,110,'#ffb864',320);score+=4500;credits+=400;finish(true)}else{burst(e.x,e.y,18,e.color,180);score+=e.points;credits+=Math.ceil(e.points/10);kills++;if(Math.random()<.13)pickups.push({x:e.x,y:e.y,r:10,type:Math.random()<.7?'shield':'repair',phase:0});tone(115,.17,'triangle',.035,40)}}}
function finish(win){if(mode!=='playing')return;mode=win?'victory':'defeat';save.best=Math.max(save.best,score);save.bank+=credits;save.totalKills+=kills;if(win)save.wins++;persist();setTimeout(()=>{if(mode!=='victory'&&mode!=='defeat')return;show(`<div class="eyebrow">${win?'МИССИЯ ВЫПОЛНЕНА':'СИГНАЛ ПОТЕРЯН'}</div><h1 style="font-size:clamp(28px,5vw,47px)">${win?'ПОБЕДА ПОВСТАНЦЕВ':'КОРАБЛЬ УНИЧТОЖЕН'}</h1><p>${win?'Имперский флагман уничтожен. Сектор освобождён, а твоя эскадрилья возвращается домой.':'Твой корабль пал, но добытые сведения и ресурсы переданы на базу. Сопротивление продолжается.'}</p><div class="stats"><div class="stat"><strong>${score}</strong><small>ОЧКИ</small></div><div class="stat"><strong>${kills}</strong><small>СБИТО</small></div><div class="stat"><strong>+${credits}</strong><small>КРЕДИТЫ</small></div></div><div class="actions">${btn('↻ НОВАЯ МИССИЯ','start',true)}${btn('⚙ АНГАР','hangar')}${btn('⌂ МЕНЮ','home')}</div>`)},850)}
function updateHUD(){if(!player)return;$('healthBar').style.width=clamp(player.hp/player.maxHp*100,0,100)+'%';$('shieldBar').style.width=clamp(player.shield/player.maxShield*100,0,100)+'%';$('dashBar').style.width=player.dash*100+'%';$('missionText').textContent='ВНЕШНЕЕ КОЛЬЦО · СЕКТОР '+String(wave).padStart(2,'0');$('waveText').textContent=wave===5?'ФИНАЛЬНАЯ БИТВА':'ВОЛНА '+wave;$('scoreText').textContent=score;$('creditText').textContent=credits;if(boss)$('bossBar').style.width=clamp(boss.hp/boss.maxHp*100,0,100)+'%';else $('bossBox').style.display='none'}
function update(dt){t+=dt;if(toastClock>0){toastClock-=dt;if(toastClock<=0)$('toast').style.opacity=0}shake=Math.max(0,shake-dt*25);for(let s of stars){s.y+=s.speed*dt*(mode==='playing'?1.5:1);if(s.y>H){s.y=0;s.x=rnd(0,W)}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-dt*.8;p.vy*=1-dt*.8;p.life-=dt;if(p.life<=0)particles.splice(i,1)}for(let i=texts.length-1;i>=0;i--){texts[i].y-=30*dt;texts[i].life-=dt;if(texts[i].life<=0)texts.splice(i,1)}if(mode!=='playing')return;waveClock+=dt;let p=player;p.inv=Math.max(0,p.inv-dt);p.fire-=dt;p.dashing=Math.max(0,p.dashing-dt);p.dash=Math.min(1,p.dash+dt/4);p.shield=Math.min(p.maxShield,p.shield+dt*(2.8+save.level.engine*.7));let dx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0)+joy.x,dy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0)+joy.y;let len=Math.hypot(dx,dy);if(len>0){dx/=Math.max(1,len);dy/=Math.max(1,len)}if((keys.ShiftLeft||keys.ShiftRight||keys.dash)&&p.dash>=1&&len>0){p.dash=0;p.dashing=.2;p.inv=Math.max(p.inv,.25);burst(p.x,p.y,16,'#56d8ff',85);tone(270,.18,'sine',.05,650)}p.x=clamp(p.x+dx*p.speed*(p.dashing?3:1)*dt,20,W-20);p.y=clamp(p.y+dy*p.speed*(p.dashing?3:1)*dt,40,H-20);p.angle=dx*.14;
if((keys.Space||pointer.down||firing)&&p.fire<=0){let cooldown=Math.max(.09,.21-runUpgrade.fire*.027);p.fire=cooldown;let damage=(20+runUpgrade.damage*5)*(1+save.level.damage*.15);shot(p.x-11,p.y-10,0,-590,false,damage);shot(p.x+11,p.y-10,0,-590,false,damage);if(runUpgrade.fire>=2)shot(p.x,p.y-15,0,-650,false,damage*.55);tone(580,.065,'sawtooth',.016,230)}
if(!boss){spawnClock-=dt;if(spawnLeft>0&&spawnClock<=0){let roll=Math.random();enemy(wave>=3&&roll>.82?'bomber':wave>=2&&roll>.53?'interceptor':'tie');spawnLeft--;spawnClock=Math.max(.27,1.05-wave*.1)+rnd(0,.3)}if(spawnLeft===0&&enemies.length===0&&waveClock>3){if(wave<5){mode='upgrade';let costs=[['damage','Усиленные лазеры','Урон +25%'],['fire','Скорострельность','Темп огня +'],['shield','Восстановление','Полный ремонт и +20 щита']];show(`<div class="eyebrow">СЕКТОР ${wave} ЗАЧИЩЕН</div><h2>ПОЛЕВАЯ МОДЕРНИЗАЦИЯ</h2><p>Выбери одно улучшение. Оно действует до конца текущего вылета.</p><div class="shop">${costs.map(([id,note,desc])=>`<button data-action="upgrade:${id}"><b>${note}</b><span>${desc}</span><span class="price">БЕСПЛАТНО</span></button>`).join('')}</div><div class="tiny">СЛЕДУЮЩАЯ ВОЛНА: ${wave+1}</div>`)}else finish(true)}}}
for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];e.phase+=dt;e.y+=e.speed*dt;e.x+=Math.sin(e.phase*2.3)*37*dt;e.x=clamp(e.x,e.r,W-e.r);e.f-=dt;if(e.f<=0&&e.y>20&&e.y<H*.83){let vx=clamp((p.x-e.x)*.7,-125,125);shot(e.x,e.y+10,vx,265+wave*12,true,e.type==='bomber'?22:12);e.f=e.fire*rnd(.85,1.25)}if(dist(e,p)<e.r+p.r){hurt(e.type==='bomber'?33:20);e.hp=0;burst(e.x,e.y,20,e.color)}if(e.y>H+70)e.hp=0;if(e.hp<=0)enemies.splice(i,1)}
if(boss){let b=boss;b.movement+=dt;if(b.y<105)b.y+=45*dt;else{b.x=W/2+Math.sin(b.movement*.75)*Math.min(165,W*.26);b.fire-=dt;if(b.fire<=0){b.fire=1.4;for(let k=-2;k<=2;k++)shot(b.x+k*24,b.y+48,k*35,235,true,15,'#ff435b');tone(95,.25,'sawtooth',.03,60)}if(Math.random()<dt*1.5){shot(b.x-53,b.y+55,-45,240,true,13);shot(b.x+53,b.y+55,45,240,true,13)}}if(dist({x:b.x,y:b.y+48},p)<64)hurt(35)}
for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let remove=b.life<=0||b.y< -20||b.y>H+20||b.x< -30||b.x>W+30;if(!remove){if(b.enemy){if(dist(b,p)<b.r+p.r*.7){hurt(b.damage);remove=true}}else{if(boss&&Math.abs(b.x-boss.x)<65&&Math.abs(b.y-boss.y)<55){damageEnemy(boss,b.damage,true);remove=true}else{for(let e of enemies){if(e.hp>0&&dist(b,e)<b.r+e.r){damageEnemy(e,b.damage);remove=true;break}}}}if(remove)bullets.splice(i,1)}
for(let i=pickups.length-1;i>=0;i--){let c=pickups[i];c.y+=48*dt;c.phase+=dt*4;if(dist(c,p)<c.r+p.r){if(c.type==='repair')p.hp=Math.min(p.maxHp,p.hp+32);else p.shield=Math.min(p.maxShield,p.shield+35);floatText(p.x,p.y-30,c.type==='repair'?'+ КОРПУС':'+ ЩИТ','#65ffa8');tone(800,.19,'sine',.03,1200);pickups.splice(i,1)}else if(c.y>H+30)pickups.splice(i,1)}updateHUD()}
function drawShip(x,y,rot=0,flash=false){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.shadowColor='#43bfff';ctx.shadowBlur=flash?25:12;ctx.fillStyle=flash?'#ffffff':'#c8e4ed';ctx.strokeStyle='#3d8db1';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-23);ctx.lineTo(9,-8);ctx.lineTo(21,-5);ctx.lineTo(24,10);ctx.lineTo(15,14);ctx.lineTo(9,9);ctx.lineTo(-9,9);ctx.lineTo(-15,14);ctx.lineTo(-24,10);ctx.lineTo(-21,-5);ctx.lineTo(-9,-8);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#112d44';ctx.beginPath();ctx.ellipse(0,-5,6,11,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#58cfff';ctx.shadowBlur=17;ctx.fillRect(-14,13,5,9+rnd(0,6));ctx.fillRect(9,13,5,9+rnd(0,6));ctx.restore()}
function drawTie(e){ctx.save();ctx.translate(e.x,e.y);ctx.strokeStyle=e.color;ctx.fillStyle='#152435';ctx.lineWidth=3;ctx.shadowColor=e.color;ctx.shadowBlur=6;if(e.type==='bomber'){ctx.fillStyle='#202639';ctx.fillRect(-22,-16,16,35);ctx.fillRect(6,-16,16,35);ctx.strokeRect(-22,-16,16,35);ctx.strokeRect(6,-16,16,35);ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.fill();ctx.stroke()}else{let s=e.r;ctx.beginPath();ctx.moveTo(-s,-s);ctx.lineTo(-s,s);ctx.lineTo(-s*.55,s*.55);ctx.lineTo(-s*.55,-s*.55);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(s,-s);ctx.lineTo(s,s);ctx.lineTo(s*.55,s*.55);ctx.lineTo(s*.55,-s*.55);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(0,0,s*.5,0,7);ctx.fillStyle='#657c88';ctx.fill();ctx.stroke()}ctx.restore()}
function drawBoss(b){ctx.save();ctx.translate(b.x,b.y);ctx.shadowColor='#ff4d62';ctx.shadowBlur=16;ctx.fillStyle='#667785';ctx.strokeStyle='#aabcc9';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,77);ctx.lineTo(-64,-65);ctx.lineTo(-37,-60);ctx.lineTo(0,-49);ctx.lineTo(37,-60);ctx.lineTo(64,-65);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#202d3d';ctx.beginPath();ctx.moveTo(0,50);ctx.lineTo(-21,-23);ctx.lineTo(0,-31);ctx.lineTo(21,-23);ctx.closePath();ctx.fill();ctx.fillStyle='#b9d4e8';ctx.fillRect(-15,-44,30,12);ctx.fillRect(-8,-58,16,14);for(let i=-2;i<=2;i++){ctx.fillStyle='#ff536a';ctx.fillRect(i*16-3,4+Math.abs(i)*-10,6,6)}ctx.restore()}
function render(){ctx.save();ctx.fillStyle='#030915';ctx.fillRect(0,0,W,H);let grad=ctx.createRadialGradient(W*.5,H*.4,0,W*.5,H*.4,Math.max(W,H)*.75);grad.addColorStop(0,'#11324b');grad.addColorStop(.5,'#091327');grad.addColorStop(1,'#02050b');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);for(let s of stars){ctx.globalAlpha=s.alpha;ctx.fillStyle=s.speed>65?'#d2f6ff':'#7cb0dc';ctx.fillRect(s.x,s.y,s.r,mode==='playing'?s.r*2.3:s.r)}ctx.globalAlpha=1;ctx.translate(rnd(-shake,shake),rnd(-shake,shake));if(mode==='playing'||mode==='paused'||mode==='defeat'||mode==='victory'){for(let c of pickups){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.phase);ctx.strokeStyle=c.type==='repair'?'#76ffa0':'#7db4ff';ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=16;ctx.lineWidth=3;ctx.strokeRect(-8,-8,16,16);ctx.restore()}for(let b of bullets){ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=13;ctx.fillRect(b.x-2,b.y-8,4,16)}ctx.shadowBlur=0;for(let e of enemies)drawTie(e);if(boss)drawBoss(boss);if(player&&player.hp>0){if(player.inv<=0||Math.floor(t*17)%2===0)drawShip(player.x,player.y,player.angle,player.dashing>0);if(player.shield>0){ctx.beginPath();ctx.arc(player.x,player.y,25,0,Math.PI*2);ctx.strokeStyle=`rgba(100,165,255,${.12+.17*player.shield/player.maxShield})`;ctx.lineWidth=2;ctx.stroke()}}}for(let p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.r,p.r)}ctx.globalAlpha=1;for(let a of texts){ctx.globalAlpha=a.life;ctx.fillStyle=a.color;ctx.font='bold 15px Arial';ctx.textAlign='center';ctx.fillText(a.value,a.x,a.y)}ctx.restore()}
function loop(ts){let dt=Math.min((ts-last)/1000||0,.035);last=ts;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function pause(){if(mode==='playing'){mode='paused';show(`<div class="eyebrow">ПОЛЁТ ПРИОСТАНОВЛЕН</div><h2>ПАУЗА</h2><p>Сектор ${wave}. Текущий счёт: <b>${score}</b>. Добыто кредитов: <b>${credits}</b>.</p><div class="actions">${btn('▶ ПРОДОЛЖИТЬ','resume',true)}${btn('↻ НАЧАТЬ ЗАНОВО','start')}${btn('⌂ ВЫЙТИ В МЕНЮ','quit')}</div>`)}else if(mode==='paused')resume()}
function resume(){mode='playing';menu.style.display='none';hud.style.display='flex';$('pause').style.display='block';$('mobile').classList.add('playing')}
function act(a){if(a==='start')start();else if(a==='home')splash();else if(a==='hangar')hangar();else if(a==='resume')resume();else if(a==='quit'){save.bank+=credits;save.best=Math.max(save.best,score);save.totalKills+=kills;persist();splash()}else if(a==='sound'){settings.mute=!settings.mute;splash()}else if(a.startsWith('buy:')){let type=a.split(':')[1],level=save.level[type],cost=100+level*95;if(level<5&&save.bank>=cost){save.bank-=cost;save.level[type]++;persist();tone(850,.15,'sine',.04,1150);hangar()}}else if(a.startsWith('upgrade:')){let type=a.split(':')[1];runUpgrade[type]++;if(type==='shield'){player.maxShield+=20;player.shield=player.maxShield;player.hp=Math.min(player.maxHp,player.hp+30)}resume();nextWave()}}
panel.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b&&!b.disabled)act(b.dataset.action)});$('pause').addEventListener('click',pause);
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();keys[e.code]=true;if((e.code==='Escape'||e.code==='KeyP')&&!e.repeat)pause()});addEventListener('keyup',e=>{keys[e.code]=false});addEventListener('blur',()=>{if(mode==='playing')pause();for(let k in keys)keys[k]=false;pointer.down=false;firing=false});canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button===0)pointer.down=true});addEventListener('pointerup',()=>{pointer.down=false});canvas.addEventListener('contextmenu',e=>e.preventDefault());
let stick=$('stick'),knob=$('knob'),joyId=null;function stickMove(e){let r=stick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),mag=Math.hypot(x,y),q=Math.min(1,mag/43),ang=Math.atan2(y,x);joy.x=Math.cos(ang)*q;joy.y=Math.sin(ang)*q;knob.style.transform=`translate(${joy.x*34}px,${joy.y*34}px)`}stick.addEventListener('pointerdown',e=>{joyId=e.pointerId;stick.setPointerCapture(e.pointerId);stickMove(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===joyId)stickMove(e)});function releaseJoy(){joyId=null;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',releaseJoy);stick.addEventListener('pointercancel',releaseJoy);$('fire').addEventListener('pointerdown',e=>{e.preventDefault();firing=true;$('fire').setPointerCapture(e.pointerId)});$('fire').addEventListener('pointerup',()=>firing=false);$('fire').addEventListener('pointercancel',()=>firing=false);let previousTap=0;canvas.addEventListener('touchend',()=>{let now=performance.now();if(now-previousTap<320){keys.dash=true;setTimeout(()=>keys.dash=false,100)}previousTap=now});splash();
